name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm exec vite build ./ui

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: x86_64-unknown-linux-musl-debug

      - name: Build debug binary
        env:
          CC: musl-gcc
        run: cargo build --locked --target x86_64-unknown-linux-musl

      - name: Verify static binary
        run: file target/x86_64-unknown-linux-musl/debug/redoor | grep -Eq "static(-pie)? linked|statically linked"

  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm exec vite build ./ui

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: aarch64-linux-android-debug

      - name: Build Android debug binary
        run: cargo ndk --target arm64-v8a --platform 24 build --locked

      - name: Verify Android binary
        run: |
          file target/aarch64-linux-android/debug/redoor | grep -Eq "ELF 64-bit.*ARM aarch64"
          readelf --program-headers target/aarch64-linux-android/debug/redoor | grep -Fq "/system/bin/linker64"
