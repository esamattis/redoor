name: Build and maybe release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') }}

jobs:
  build-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm exec vite build ./ui

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: build-ui
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_name: redoor-x86_64-linux
            cc: musl-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: redoor-aarch64-macos
            cc: clang
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_name: redoor-aarch64-linux
            cc: musl-gcc
          - os: ubuntu-latest
            target: aarch64-linux-android
            archive_name: redoor-aarch64-android

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
          merge-multiple: true

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Build release binary
        if: matrix.target != 'aarch64-linux-android'
        env:
          CC: ${{ matrix.cc }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build Android release binary
        if: matrix.target == 'aarch64-linux-android'
        env:
          RUSTFLAGS: -D warnings
        run: cargo ndk --target arm64-v8a --platform 24 build --locked --release

      - name: Verify static Linux binary
        if: contains(matrix.target, 'musl')
        run: file target/${{ matrix.target }}/release/redoor | grep -Eq "static(-pie)? linked|statically linked"

      - name: Verify Android binary
        if: matrix.target == 'aarch64-linux-android'
        run: |
          file target/${{ matrix.target }}/release/redoor | grep -Eq "ELF 64-bit.*ARM aarch64"
          readelf --program-headers target/${{ matrix.target }}/release/redoor | grep -Fq "/system/bin/linker64"

      - name: Package binary
        run: tar czf ${{ matrix.archive_name }}.tar.gz -C target/${{ matrix.target }}/release redoor

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.tar.gz

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
