name: Tests

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm and Node
              uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
              with:
                  cache: true
                  install: false

            - name: Install Rust
              uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
              with:
                  toolchain: 1.97.1

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Install Toxiproxy
              run: |
                  curl --fail --location --retry 3 --output /tmp/toxiproxy-server https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64
                  chmod +x /tmp/toxiproxy-server
                  /tmp/toxiproxy-server > /tmp/toxiproxy.log 2>&1 &
                  curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8474/version

            - name: Build application
              run: pnpm run build

            - name: Run Cargo tests
              run: cargo test --locked

            - name: Run Vitest integration tests
              run: pnpm run integration-test

            - name: Run Playwright tests
              run: pnpm run playwright

            - name: Upload test diagnostics
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: test-diagnostics
                  path: |
                      log/
                      playwright-report/
                      test-results/
                      /tmp/toxiproxy.log
                  if-no-files-found: ignore
