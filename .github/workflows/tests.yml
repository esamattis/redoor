name: Tests

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.20.0

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: 26.7.0
                  cache: pnpm

            - name: Install Rust
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
              with:
                  toolchain: 1.97.1

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Install Toxiproxy
              run: |
                  curl --fail --location --retry 3 --output /tmp/toxiproxy-server https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64
                  chmod +x /tmp/toxiproxy-server
                  /tmp/toxiproxy-server > /tmp/toxiproxy.log 2>&1 &
                  curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8474/version

            - name: Build application
              run: pnpm run build

            - name: Run Cargo tests
              run: cargo test --locked

            - name: Run Vitest integration tests
              run: pnpm run integration-test

            - name: Run Playwright tests
              run: pnpm run playwright

            - name: Upload test diagnostics
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: test-diagnostics
                  path: |
                      log/
                      playwright-report/
                      test-results/
                      /tmp/toxiproxy.log
                  if-no-files-found: ignore
