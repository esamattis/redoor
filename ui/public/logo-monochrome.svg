<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" role="img" aria-labelledby="title description">
    <title id="title">Monochrome Redoor logo</title>
    <desc id="description">A black lowercase r forming a doorway, with a black open door and white terminal prompt.</desc>
    <defs>
        <radialGradient id="background" cx="50%" cy="43%" r="73%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.74" stop-color="#fdfdfd" />
            <stop offset="1" stop-color="#f8f8f8" />
        </radialGradient>
        <linearGradient id="letter" x1="0" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#020202" />
            <stop offset="1" stop-color="#090909" />
        </linearGradient>
        <linearGradient id="door" gradientUnits="userSpaceOnUse" x1="263" y1="249" x2="354" y2="520">
            <stop offset="0" stop-color="#020202" />
            <stop offset="1" stop-color="#111111" />
        </linearGradient>
        <linearGradient id="floor" gradientUnits="userSpaceOnUse" x1="238" y1="476" x2="440" y2="552">
            <stop offset="0" stop-color="#050505" />
            <stop offset="0.7" stop-color="#151515" />
            <stop offset="1" stop-color="#303030" />
        </linearGradient>
        <filter id="ambient" x="-25%" y="-25%" width="150%" height="160%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
        </filter>
        <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3" />
        </filter>
        <clipPath id="frame">
            <rect width="620" height="620" />
        </clipPath>
    </defs>

    <g clip-path="url(#frame)">
        <rect width="620" height="620" fill="url(#background)" />

        <g transform="translate(60)" filter="url(#ambient)">
            <path
                d="M263 249 L354 296 L354 520 L263 486 Z"
                fill="url(#door)"
                stroke="#171717"
                stroke-width="1.4"
                stroke-linejoin="round"
            />

            <path d="M105 514 L238 476 L440 552 L223 552 C181 550 141 537 105 514 Z" fill="url(#floor)" />

            <path
                d="M108 67 H226 C233 67 238 73 238 80 V128 C273 92 311 70 350 68 C377 67 404 70 431 77 C436 78 439 82 439 88 V208 C439 215 434 219 428 216 C353 184 289 199 238 254 V477 L108 515 C101 517 95 511 95 504 V80 C95 73 101 67 108 67 Z"
                fill="url(#letter)"
                stroke="#242424"
                stroke-width="1.4"
                stroke-linejoin="round"
                filter="url(#edge)"
            />

            <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
                <path d="M140 368 L165 392 L140 416" stroke-width="7" />
                <path d="M177 416 H204" stroke-width="7" />
            </g>
        </g>
    </g>
</svg>
