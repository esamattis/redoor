[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.9.2"
edition = "2024"
# Distributed only as release binaries, never on crates.io; cargo-deny also skips license checks for private crates.
publish = false

# Dependencies run optimized in debug builds: tests push hundreds of megabytes through
# hashing, compression, regex and async I/O code that is many times slower unoptimized.
# Workspace crates stay at opt-level 0 so incremental rebuilds remain fast, and the
# dependencies are compiled once and then cached. Line tables keep backtraces readable
# while dropping the full debug info that made the binary tests upload over SSH balloon.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[workspace.dependencies]
blake3 = "1.8"
redoor-protocol = { path = "crates/redoor-protocol" }
redoor-core = { path = "crates/redoor-core" }
redoor-agent = { path = "crates/redoor-agent" }
redoor-server = { path = "crates/redoor-server" }
redoor-cli = { path = "crates/redoor-cli" }

# Each crate lists the tokio features it uses; only the binary needs the multi-thread runtime.
tokio = "1.53.1"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
rustls = "0.23.43"
futures-util = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
jiff = { version = "0.2.35", features = ["serde"] }
ts-rs = "12.0.1"
sysinfo = "0.39.6"
tower-http = { version = "0.6.11", features = ["cors", "limit"] }
nix = { version = "0.31.3", features = ["user", "signal", "process", "event", "hostname", "term"] }
libc = "0.2"
fastrand = "2.5.0"
async-stream = "0.3.6"
bytes = "1.12.1"
mime_guess = "2.0.5"
headers = "0.4.1"
tar = "0.4.46"
flate2 = "1.1.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
# No `charset`: responses are JSON/bytes, so encoding_rs-based text decoding is unused.
reqwest = { version = "0.13.4", default-features = false, features = ["default-tls", "http2", "stream", "system-proxy"] }
url = "2.5.8"
# Terminal prompts for `redoor remote login`; only the console backend, no editor/tempfile.
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
semver = "1.0.27"
axum-embed = "0.1.0"
rust-embed = "8.12.0"
toml_edit = "0.25.13"
pty-process = { version = "0.5.3", features = ["async"] }
# Only the hasher: salts come from getrandom, so the rand_core/getrandom 0.2 stack is not needed.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
subtle = "2.6.1"
sha2 = "0.11"
getrandom = "0.4"
# Generates and encodes the per-device ed25519 keys in-process, so no external tool writes them.
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std"] }
zeroize = "1"
base64 = "0.22.1"
nucleo-matcher = "0.3.1"
async-compression = { version = "0.4.43", features = ["tokio", "gzip"] }
tokio-util = { version = "0.7.19", features = ["io"] }
similar = "3.1.2"
ignore = "0.4.33"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
# `revision` resolves user-supplied revisions (branches, tags, ids) for history browsing.
gix = { version = "0.90.0", default-features = false, features = ["status", "revision", "parallel", "sha1"] }
# Names status-walk enums returned by gix without enabling any additional Git capabilities.
gix-dir = "0.32.0"
mountpoints = "0.2.1"
libloading = "0.9.0"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "FoundationErrors", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL"] }
rcgen = "0.14.5"
tokio-rustls = "0.26.4"
