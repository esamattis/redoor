[package]
name = "redoor-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
redoor-protocol.workspace = true
redoor-core.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
fastrand.workspace = true
flate2.workspace = true
futures-util.workspace = true
gix.workspace = true
gix-dir.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
ignore.workspace = true
jiff.workspace = true
libc.workspace = true
libghostty-vt.workspace = true
mime_guess.workspace = true
nix.workspace = true
nucleo-matcher.workspace = true
pty-process.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
sysinfo.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
uuid.workspace = true
