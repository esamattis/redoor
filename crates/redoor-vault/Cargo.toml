[package]
name = "redoor-vault"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The `.redoorvault` file format. A crate of its own so only the roles that may hold file
# keys (the server, and later the CLI) can link it; agents only ever see ciphertext.
[dependencies]
redoor-protocol.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
