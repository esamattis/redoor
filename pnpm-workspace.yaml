allowBuilds:
  esbuild: true
patchedDependencies:
  '@replit/codemirror-vim-core@0.1.0': patches/@replit__codemirror-vim-core@0.1.0.patch
  '@wterm/dom@0.6.0': patches/@wterm__dom@0.6.0.patch
  picomatch@4.0.7: patches/picomatch@4.0.7.patch
overrides:
  # @tailwindcss/typography pins 6.0.10 exactly, which is vulnerable to GHSA-rj75-hqrm-r3gf
  postcss-selector-parser@<6.1.5: ^6.1.5
minimumReleaseAgeExclude:
  - '@wterm/core@0.6.0'
  - '@wterm/dom@0.6.0'
  - '@wterm/ghostty@0.6.0'
  - '@cloudflare/oxlint-config@0.1.0'
# The local picomatch patch blocks repeated wildcard branches. Registry audits
# cannot recognize patched contents; remove this exception with a fixed release.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
