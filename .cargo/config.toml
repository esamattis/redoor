# ts-rs writes generated TypeScript next to the UI regardless of which crate defines the type.
[env]
TS_RS_EXPORT_DIR = { value = "bindings", relative = true }
# libghostty-vt parses terminal output from agents, which is untrusted. ReleaseSafe keeps Zig's
# bounds and overflow checks in release builds instead of the crate's ReleaseFast default.
LIBGHOSTTY_VT_SYS_OPTIMIZE = "ReleaseSafe"
