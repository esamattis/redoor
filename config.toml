# redoor config file. Pass with: redoor server --config config.toml
# Shared by server and agent. Precedence: CLI > env > config file > default.

agent_token = "dev-agent-token" # required; shared registration secret

[server]
# port = 3006          # optional; also settable via --port / REDOOR_PORT
# bind = "0.0.0.0"     # optional; default 127.0.0.1
# cookie_secure = false # set true when serving over HTTPS
# log = "log/server.log" # optional; also settable via --log
# log_level = "info"    # trace, debug, info, warning, or error
username = "admin"       # optional pair with password; omit both on Linux for PAM
password = "secret"

# Standalone agent (redoor agent / systemd --mode agent). Not used for [[agents]].
# [agent]
# server = "http://127.0.0.1:7666"
# name = "local"
# home = "/home/esamatti"
# log = "/home/esamatti/redoor-agent.log"
# log_level = "info"

[[agents]]
target = "devbox"
#remote_bin = "/home/esamatti/code/redoor/target/debug/redoor"
#home = "/home"
log = "redoor-agent.log"   # optional; redirects the agent's stdout/stderr to this local file

[[agents]]
name = "local"
local = true
home = "/home/esamatti"
log = "/home/esamatti/redoor-agent.log"    # optional; redirects the agent's stdout/stderr to this file

# Named standalone relays are started explicitly with `redoor agent relay start ID`.
# [[relays]]
# id = "production"
# target = "user@example.com"
# server = "https://redoor.example.com"
# name = "production-agent"
# agent_app_name = "redoor-production-agent"
